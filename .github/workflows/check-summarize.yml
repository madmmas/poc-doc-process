name: Check summarize_document Lambda

on:
  push:
    branches: [main, master, feature/*, feat/*]
    paths:
      - "lambdas/summarize_document/**"
      - ".github/workflows/check-summarize.yml"
  pull_request:
    branches: [main, master, feature/*, feat/*]
    paths:
      - "lambdas/summarize_document/**"
      - ".github/workflows/check-summarize.yml"

jobs:
  check-summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Run check-summarize
        run: make check-summarize
