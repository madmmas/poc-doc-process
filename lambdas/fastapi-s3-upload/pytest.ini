[pytest]
# Pytest configuration for FastAPI S3 Upload tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: marks tests as integration tests (requires LocalStack S3)
    unit: marks tests as unit tests (deselect with '-m "not unit"')

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -W ignore::DeprecationWarning:moto
    -W ignore::DeprecationWarning:boto3
    -W ignore::DeprecationWarning:botocore.auth
    -W ignore::DeprecationWarning:botocore.utils
    -W ignore::UserWarning
    -W default::pytest.PytestUnraisableExceptionWarning
    -W default::pytest.PytestCollectionWarning

# Coverage (if pytest-cov is installed)
# addopts = --cov=app --cov-report=html --cov-report=term
