[project]
name = "summarize-document"
version = "0.1.0"
description = "Document summarization Lambda"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "aws-lambda-powertools>=2.0.0",
    "moto[ssm,secretsmanager,s3]>=4.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "safety>=3.0.0",
    "types-boto3>=1.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
exclude = ["__pycache__", ".venv", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = ["ARG001"]  # unused function argument (e.g. context)

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["test_*.py", "conftest.py", "__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 70
